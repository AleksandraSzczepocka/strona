<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Rejestracja — Mimcry Experiments</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth">
<a class="logo" href="/">MIMCRY<span> EXPERIMENTS</span></a>
<main class="auth-card">
    <div class="eyebrow">SPOŁECZNOŚĆ</div>
    <h1>UTWÓRZ KONTO</h1>
    <form id="registerForm">
        <input name="username" placeholder="Nazwa użytkownika" required minlength="3">
        <input name="email" type="email" placeholder="E-mail" required>
        <input name="password" type="password" placeholder="Hasło — min. 8 znaków" required minlength="8">
        <label><input type="checkbox" required> Akceptuję regulamin</label>
        <button class="btn">Utwórz konto</button>
    </form>
    <p>Masz już konto? <a href="/login.html">Zaloguj się</a></p>
    <div id="message"></div>
</main>
<script src="/js/app.js"></script>
</body>
</html>
