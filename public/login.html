<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Logowanie — Mimcry Experiments</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth">
<a class="logo" href="/">MIMCRY<span> EXPERIMENTS</span></a>
<main class="auth-card">
    <div class="eyebrow">KONTO</div>
    <h1>ZALOGUJ SIĘ</h1>
    <form id="loginForm">
        <input name="email" type="email" placeholder="E-mail" required>
        <input name="password" type="password" placeholder="Hasło" required>
        <button class="btn">Zaloguj</button>
    </form>
    <p>Nie masz konta? <a href="/register.html">Zarejestruj się</a></p>
    <div id="message"></div>
</main>
<script src="/js/app.js"></script>
</body>
</html>
